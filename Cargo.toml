[workspace]
resolver = "2"
members = ["pliron-derive", "pliron-llvm", "pliron-llvm/llvm-opt"]

[package]
name = "pliron"
description = "Programming Languages Intermediate RepresentatiON"
version.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[workspace.package]
version = "0.18.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pliron-org/pliron"
categories = ["compilers"]
keywords = ["pliron", "llvm", "mlir", "compiler"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
std = ["dep:utf8-chars", "combine/std", "hi_sparse_bitset/std"]
default = ["std"]

[dependencies]
pliron-derive = { path = "./pliron-derive", version = "=0.18.0" }

awint.workspace = true
rustc_apfloat.workspace = true
rustc-hash.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
smallvec.workspace = true
thiserror.workspace = true
combine.workspace = true
log.workspace = true
hi_sparse_bitset.workspace = true
slotmap.workspace = true
once_vec.workspace = true
downcast-rs.workspace = true
dyn-clone.workspace = true
utf8-chars = { workspace = true, optional = true }

# Only used in `no_std`, but can't express that.
spin = "0"

[target.'cfg(target_family = "wasm")'.dependencies]
inventory = "0"
[target.'cfg(not(target_family = "wasm"))'.dependencies]
linkme = "0"

[dev-dependencies]
expect-test.workspace = true
env_logger.workspace = true
clap.workspace = true
utf8-chars.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
pliron-llvm = { path = "./pliron-llvm" }
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[workspace.dependencies]
awint = { version = "0", default-features = false, features = ["alloc"] }
bitflags = "2"
rustc_apfloat = "0.2"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
expect-test = "1"
proc-macro2 = "1"
quote = "1"
prettyplease = "0"
rustc-hash = { version = "2", default-features = false }
hashbrown = "0"
indexmap = { version = "2", default-features = false }
smallvec = { version = "1", default-features = false }
combine = { version = "4", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
tempfile = "3"
log = { version = "0" }
env_logger = "0"
cargo-manifest = "0"
which = "8"
hi_sparse_bitset = { version = "0.9", path = "../hi_sparse_bitset", default-features = false, features = ["simd"] }
utf8-chars = "3"
slotmap = { version = "1", default-features = false }
once_vec = "0"
downcast-rs = { version = "2", default-features = false }
dyn-clone = "1"

[[example]]
name = "kaleidoscope"
path = "examples/kaleidoscope/main.rs"
test = true
